<!doctype html><html><head><meta charset="utf-8"><style>body{margin:24px;background:#0e1110;color:#f3f6f3;font:14px system-ui}select,button{padding:8px;font:inherit}.shots{display:flex;gap:16px;margin-top:16px}figure{margin:0;flex:1;min-width:0}img{width:100%;height:auto}a{color:#98d2ac}@media(max-width:700px){.shots{display:block}figure{margin-bottom:20px}}</style></head><body><h1>Saved mix removal</h1><p>Matching native Mac demo captures. The new remove control is disabled in demo; functional deletion and stale-sync protection use isolated regression tests.</p><select id="state" aria-label="Theme and size"><option value="dark-normal">Dark · 1440×900</option><option value="light-normal">Light · 1440×900</option><option value="dark-narrow">Dark · 900×760</option><option value="light-narrow">Light · 900×760</option></select><button id="prev">Previous</button><button id="next">Next</button><div class="shots"><figure><img id="before" alt="Before"><figcaption><a id="b">Before</a></figcaption></figure><figure><img id="after" alt="After"><figcaption><a id="a">After</a></figcaption></figure></div><script>let e=document.getElementById('state');function draw(){for(let kind of ['before','after']){let p=kind+'-'+e.value+'.jpg';document.getElementById(kind).src=p;document.getElementById(kind==='before'?'b':'a').href=p}}e.onchange=draw;for(let [id,delta] of [['prev',-1],['next',1]])document.getElementById(id).onclick=()=>{e.selectedIndex=(e.selectedIndex+delta+4)%4;draw()};draw();</script></body></html>
